[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-only WITH LicenseRef-Modelith-Plugin-Exception"
repository = "https://github.com/modelith/modelith"
rust-version = "1.85"

[workspace.dependencies]
modelith-core = { path = "crates/modelith-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
