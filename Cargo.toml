[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-alpha.5"
edition = "2024"
license = "AGPL-3.0-only WITH LicenseRef-Modelith-Plugin-Exception"
repository = "https://github.com/modelith/modelith"
rust-version = "1.85"

[workspace.dependencies]
modelith-core = { path = "crates/modelith-core" }
# プラグインとの契約（ADR-0004・ADR-0018）。版は plugin-sdk のコミットで固定する
modelith-plugin-protocol = { git = "https://github.com/modelith/plugin-sdk", rev = "b4d38e0eaa7fd74f3fff13b619198fd23d5aea67" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# ブラウザに配る wasm。速度を優先する（"s" より 3 のほうが小さく、速かった。ADR-0015）
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
