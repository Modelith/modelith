# 依存の更新を PR で受け取る（dev 向け）。
# Actions は SHA で固定しているので、更新もここで受ける。npm と cargo は本番の依存だけでなく開発の依存も含む。
# cooldown: 公開から 7 日たっていない版は提案しない（乗っ取られた版を取り込まないため）。
# セキュリティ更新には cooldown が効かない仕様なので、急ぎの修正は遅れない。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
