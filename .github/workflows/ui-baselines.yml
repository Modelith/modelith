name: UI baselines

# UI テストの基準画像を作り直す（docs/development/testing.md）。手元に Docker があれば scripts/e2e.sh で同じものを作れる。
# トピックブランチへのコミットのメッセージに [ui-baselines] を含めたときだけ動く。
# 作った画像は成果物 ui-baselines に置く。成果物を取れない環境（エージェントなど）向けに、ログにも base64 で出す。
on:
  push:
    branches-ignore: [main, dev]

permissions:
  contents: read

jobs:
  baselines:
    if: contains(github.event.head_commit.message, '[ui-baselines]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      - name: Generate baselines
        run: scripts/e2e.sh e2e/visual.spec.ts --update-snapshots=all
      - uses: actions/upload-artifact@v7
        with:
          name: ui-baselines
          path: web/e2e/visual.spec.ts-snapshots/
      - name: Print baselines (tar.gz, base64)
        run: |
          echo "=====BEGIN UI BASELINES====="
          tar czf - -C web/e2e visual.spec.ts-snapshots | base64 -w 20000
          echo "=====END UI BASELINES====="
