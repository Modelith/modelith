name: Pages

# GitHub のリリースを公開すると、Web アプリを GitHub Pages に公開する（docs/development/releasing.md）。
# 安定版（最新の正式版、無ければ最新の rc）を /modelith/ に、プレリリース版（最も新しい版）を /modelith/preview/ に置く（ADR-0020）。
# どのリリースを公開しても、公開済みのリリースの一覧から 2 つの版を選び直し、両方をビルドする（Pages は 1 つのサイトしか置けないため）。
# リリースの下書きは release-draft.yml が作り、公開（Publish）はメンテナが画面で行う。公開したときにタグも作られる。
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read  # リリースの一覧とタグを読む
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 系列ごとの版のタグを作業ツリーに取り出すため
      # GitHub の実行環境の rustup は古いことがある。古い rustup はツールチェーンを取るときの TLS の確かめが甘い
      # （RUSTSEC-2026-0382）ので、ツールチェーンを入れる前に rustup 自身を更新し、1.29.2 以上であることを確かめる
      - name: Update rustup itself
        run: |
          rustup self update
          scripts/check-rustup.sh
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (2026-10)
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true  # 毎回その時点の最新の 22.x を使う（セキュリティリリースをすぐ取り込む）
          cache: npm
          cache-dependency-path: web/package-lock.json
      # 公開済みのリリースから、系列ごとの版を選ぶ（判断は web/tools/channels.ts）
      - name: Pick the versions to publish
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release list --limit 200 --json tagName,isDraft | node web/tools/channels-cli.ts | tee -a "$GITHUB_OUTPUT"
      # 版ごとに、そのタグの中身で e2e・UI テストを流してからビルドする（失敗したら公開しない）。
      # ブラウザは Playwright の公式イメージ（Docker）の中で動かす（scripts/e2e.sh）
      - name: Test and build both channels
        run: scripts/pages-build.sh "${{ steps.pick.outputs.stable }}" "${{ steps.pick.outputs.preview }}" site "/${{ github.event.repository.name }}/"
      # テストが落ちて公開しなかったときは、失敗時の画面・差分画像・トレースを残し、原因を追えるようにする
      - name: Upload test results of the failed channel
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-test-results
          path: pages-test-results/
          if-no-files-found: ignore
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
