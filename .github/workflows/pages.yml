name: Pages

# リリースのタグ（vX.Y.Z[-段階.N]）を打つと Web アプリを GitHub Pages に公開する（docs/development/releasing.md）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      # 公開する版で e2e・UI テストを流し、そのレポートも一緒に公開する（失敗したら公開しない）
      # ブラウザは Playwright の公式イメージ（Docker）の中で動かす（scripts/e2e.sh）
      - name: e2e and UI tests
        run: scripts/e2e.sh
      - name: Build
        run: npm run build --prefix web
        env:
          MODELITH_BASE: /${{ github.event.repository.name }}/
      - name: Add test reports
        run: cp -r web/reports web/dist/reports
      # reports/e2e/ の画面は Playwright（Apache-2.0）の配布物なので、LICENSE と NOTICE を添える（C-5）
      - name: Add licenses of the test report viewer
        run: cp web/node_modules/playwright-core/{LICENSE,NOTICE,ThirdPartyNotices.txt} web/dist/reports/e2e/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
