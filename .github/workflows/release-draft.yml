name: Release draft

# リリースの下書きを作る（docs/development/releasing.md）。下書きの本文は docs/releases/v<版>.md。
# - 版を上げる PR を dev（rc・正式版は main）にマージすると、自動で下書きを作る（その版のノートがあり、リリースがまだ無いとき）
# - 手で起動すると、下書きが無ければ作り、あれば本文だけを差し替える
# 公開（Publish）はメンテナが GitHub の画面で行い、公開するとタグが作られ、Pages のワークフローが動く。
on:
  push:
    branches: [dev, main]
    paths: ["Cargo.toml", "docs/releases/**"]
  workflow_dispatch:
    inputs:
      version:
        description: "版（例: 0.1.0-alpha.4。先頭の v は付けない）"
        required: true
      branch:
        description: "対象のブランチ（alpha・beta は dev、rc と正式版は main）"
        required: true
        type: choice
        options: [dev, main]
        default: dev

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 手で起動したときは選んだブランチ、push のときはそのコミット
          ref: ${{ inputs.branch || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Create or update the release draft
        run: scripts/release-draft.sh "${VERSION:---auto}"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
