name: Release draft

# リリースの下書きを作る（docs/development/releasing.md）。版を上げる PR を dev にマージしてから、手で（またはエージェントが）起動する。
# 下書きの本文は docs/releases/v<版>.md。公開（Publish）はメンテナが GitHub の画面で行い、公開すると Pages のワークフローが動く。
# 既に公開したリリースに対して起動すると、本文だけを差し替える。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "版（例: 0.1.0-alpha.4。先頭の v は付けない）"
        required: true
      branch:
        description: "対象のブランチ（alpha・beta は dev、rc と正式版は main）"
        required: true
        type: choice
        options: [dev, main]
        default: dev

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Create or update the release draft
        run: scripts/release-draft.sh "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
