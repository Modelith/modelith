# shellcheck shell=bash
# リポジトリ固有のハーネス設定。
# 判断ロジック（scripts/lib/policy.sh）とフックは plugin-sdk と同じものを使い、
# リポジトリごとに異なる値はこのファイルだけに置く。

# PR 経由でのみ更新するブランチ
HARNESS_PROTECTED_BRANCHES='main|dev'

# Git 管理下に置いてはいけないパス（非公開のモック・依存物・ビルド成果物）
HARNESS_FORBIDDEN_PATHS='(^|/)node_modules/|^reference/mock/|^target/'

# この正規表現に合う変更があるとき、停止前に高速チェックを走らせる
HARNESS_VERIFY_TRIGGER='(\.(rs|ts|mjs|sh|bats)$|Cargo\.(toml|lock)$|package(-lock)?\.json$|^(scripts|reference|tests)/|^\.claude/hooks/)'

# ブロック時に案内するドキュメント
HARNESS_STRATEGY_DOC='docs/development/branching-strategy.md'
